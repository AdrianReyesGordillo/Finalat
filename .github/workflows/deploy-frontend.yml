name: Deploy Frontend to S3

on:
  push:
    branches:
      - PRD
  pull_request:
    branches:
      - PRD

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/PRD'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy index.html to S3 (short cache)
        run: |
          aws s3 cp dist/index.html s3://finalat.com.mx/index.html \
            --cache-control "public, max-age=60, must-revalidate" \
            --content-type "text/html"

      - name: Deploy hashed assets to S3 (long cache)
        run: |
          aws s3 sync dist/assets/ s3://finalat.com.mx/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Deploy remaining static files to S3
        run: |
          aws s3 sync dist/ s3://finalat.com.mx/ \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public, max-age=86400" \
            --delete
