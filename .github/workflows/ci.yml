name: CI/CD Pipeline

on:
  push:
    branches: [main, PRD]
  pull_request:
    branches: [main, PRD]

jobs:
  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (optional - ruff)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

      - name: Run type checking (optional - mypy)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install mypy
          mypy . --ignore-missing-imports

      - name: Run tests (pytest)
        working-directory: backend
        env:
          FERNET_KEY: ${{ secrets.FERNET_KEY || 'FEgXu1_DfbH1On_BoXIewE81IFkIxzg-DHMBqxiuOyw=' }}
          DATABASE_URL: "sqlite:///./test.db"
        run: pytest --tb=short -q

  frontend:
    name: Frontend (Node.js LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run type checking and build (vue-tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Run tests (vitest)
        working-directory: frontend
        run: npm run test
