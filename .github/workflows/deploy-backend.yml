name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: finalat_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: finalat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linting
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://finalat_test:testpassword@localhost:5432/finalat_test
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APP_ENV: test
        run: pytest --tb=short -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/home/ubuntu/Finalat"

            # Pull latest code
            cd $APP_DIR
            git fetch origin main
            git reset --hard origin/main

            # Activate virtual environment
            source venv/bin/activate

            # Install/update dependencies
            cd backend
            pip install -r requirements.txt --quiet

            # Run database migrations
            alembic upgrade head

            # Restart the service
            sudo systemctl restart finalat-backend
            sudo systemctl is-active --quiet finalat-backend

            echo "Backend deployment completed successfully"
